name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14' 
          cache: 'pip' # caching pip dependencies

      - name: Install python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pip install gdal-installer
          install-gdal

      - name: see if gdal exist
        run: python debug-gdal.py

      - name: and what is in the folder
        run: |
          ls C:\hostedtoolcache\windows\Python\3.14.6\x64\Lib\site-packages\osgeo
          xcopy C:\hostedtoolcache\windows\Python\3.14.6\x64\Lib\site-packages\osgeo\ osgeo\
          ls osgeo

      - name: Build Executable
        run: pyinstaller ODKToField.spec
      
      - name: Upload exe as artifact
        uses: actions/upload-artifact@v7
        with: 
          name: windows-dist
          path: dist/*
          retention-days: 31
          overwrite: true
